<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Französisch lernen mit Preply</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <div class="header-brand">
                <span class="french-flag" aria-label="Französische Flagge"></span>
                <div class="header-text">
                    <h1>Französisch lernen mit Preply</h1>
                    <p>Lernfortschritt, Stunden &amp; Vokabeln im Überblick</p>
                </div>
            </div>
            <div class="preply-logo" aria-label="Preply">
                <span class="preply-play" aria-hidden="true">▷</span>
                <span>Preply</span>
            </div>
        </header>

        <div class="top-layout">
            <form class="learning-form" id="learning-form">
                <h2><span class="plus-icon">+</span> Neue Lernsession eintragen</h2>

                <label class="date-label" for="date">Datum</label>
                <input type="date" id="date" name="date" value="2026-11-19" required>

                <label class="focus-label" for="focus">Fokus</label>
                <select id="focus" name="focus" required>
                    <option value="grammatik">Grammatik</option>
                    <option value="konversation" selected>Konversation</option>
                    <option value="hoeren-verstehen">Hören &amp; Verstehen</option>
                    <option value="vokabeln">Vokabeln</option>
                </select>

                <label class="duration-label" for="duration">Dauer (min)</label>
                <input type="number" id="duration" name="duration" value="60" min="1" step="1" required>

                <label class="vocabulary-label" for="vocabulary">Vokabeln (Anzahl)</label>
                <input type="number" id="vocabulary" name="vocabulary" value="0" min="0" step="1">

                <label class="topic-label" for="topic">Kommentar (optional)</label>
                <textarea id="topic" name="topic" placeholder="Thema: Reise &amp; Urlaub"></textarea>

                <button class="save-session-button" type="submit">+ Session speichern</button>
            </form>

            <div class="dashboard">
                <div class="stat-cards">
                    <section class="total-learning-card">
                        <span class="clock-icon" aria-hidden="true">◷</span>
                        <div class="total-learning-content">
                            <p class="total-learning-title">Gesamt Lernzeit</p>
                            <p class="total-learning-value" id="total-learning-time">0 h</p>
                        </div>
                    </section>

                    <section class="vocabulary-card">
                        <span class="book-icon" aria-hidden="true">▣</span>
                        <div class="vocabulary-content">
                            <p class="vocabulary-title">Gelernte Vokabeln</p>
                            <p class="vocabulary-value" id="total-vocabulary">0</p>
                        </div>
                    </section>

                    <section class="session-card">
                        <span class="calendar-icon" aria-hidden="true">▣</span>
                        <div class="session-content">
                            <p class="session-title">Lernsessions</p>
                            <p class="session-value" id="total-sessions">0</p>
                        </div>
                    </section>
                </div>

                <section class="learning-chart">
                    <h2><span class="clock-icon" aria-hidden="true">◷</span> Lernzeit pro Woche (h)</h2>
                    <div class="chart-area">
                        <div class="chart-scale" id="chart-scale"></div>
                        <div class="chart-bars" id="chart-bars"></div>
                    </div>
                </section>
            </div>
        </div>

        <section class="learning-log">
            <h2><span class="book-icon">▣</span> Lernprotokoll</h2>
            <table class="learning-log-table" id="learning-log-table">
                <thead>
                    <tr>
                        <th scope="col">Datum</th>
                        <th scope="col">Dauer (min)</th>
                        <th scope="col">Fokus</th>
                        <th scope="col">Vokabeln</th>
                        <th scope="col">Kommentar</th>
                        <th scope="col">Aktion</th>
                    </tr>
                </thead>
                <tbody id="learning-log-body"></tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
