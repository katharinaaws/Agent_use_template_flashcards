<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernprotokoll hinzufügen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <form class="learning-form">
            <h1><span class="plus-icon">+</span> Lernprotokoll hinzufügen</h1>

            <label class="date-label" for="date">Datum</label>
            <input type="date" id="date" name="date" value="2026-11-19">

            <label class="focus-label" for="focus">Fokus</label>
            <select id="focus" name="focus">
                <option value="grammatik">Grammatik</option>
                <option value="konversation" selected>Konversation</option>
                <option value="hoeren-verstehen">Hören &amp; Verstehen</option>
                <option value="vokabeln">Vokabeln</option>
            </select>

            <label class="duration-label" for="duration">Dauer (min)</label>
            <input type="number" id="duration" name="duration" value="60" min="1">

            <label class="vocabulary-label" for="vocabulary">Vokabeln (Anzahl)</label>
            <input type="number" id="vocabulary" name="vocabulary" value="0" min="0" step="1">

            <label class="topic-label" for="topic">Thema (optional)</label>
            <textarea id="topic" name="topic" placeholder="Thema: Reise &amp; Urlaub"></textarea>
        </form>
    </main>
</body>
</html>
